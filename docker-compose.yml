version: '3.8'

services:
  web:
    build: .
    container_name: avaliacao-treinamento
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      # Para usar PostgreSQL em vez de SQLite, defina DATABASE_URL:
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
    driver: local
